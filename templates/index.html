<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Preparation Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <script src="{{ url_for('static', filename='js/script.js') }}" defer></script>
</head>
<body>
    <main class="container">
        <header class="hero">
            <h1>Exam Preparation Application</h1>
            <p>Upload study material, search resources quickly, and discover semester-wise learning playlists.</p>
        </header>

        <section id="upload-section" class="card" aria-labelledby="upload-heading">
            <h2 id="upload-heading">Upload Study Material</h2>
            <form action="/upload" method="POST" enctype="multipart/form-data">
                <label for="file">Document</label>
                <input type="file" name="file" id="file" required>
                <label for="file_name">Display name</label>
                <input type="text" name="file_name" id="file_name" placeholder="Enter display name (optional)">
                <button type="submit">Upload</button>
            </form>
        </section>

        <section id="search-section" class="card" aria-labelledby="search-heading">
            <h2 id="search-heading">Search Study Material</h2>
            <form action="/search" method="GET">
                <label for="search-query">Search files</label>
                <input type="text" name="query" id="search-query" placeholder="Search files..." required autocomplete="off">
                <button type="submit">Search</button>
            </form>
            <div id="search-suggestions" aria-live="polite"></div>
        </section>

        <section id="semester-selection" class="card" aria-labelledby="semester-heading">
            <h2 id="semester-heading">Select Semester</h2>
            <div class="button-grid">
                {% for semester in range(1, 9) %}
                    <button type="button" class="semester-button" data-semester="{{ semester }}">Sem {{ semester }}</button>
                {% endfor %}
            </div>
        </section>

        <section class="card">
            <div id="subject-selection"></div>
            <div id="module-selection"></div>
            <h3 id="module-name"></h3>
            <div id="youtube-link"></div>
        </section>
    </main>
    <noscript>
        <p class="noscript-note">Enable JavaScript to use semester navigation and live suggestions.</p>
    </noscript>
</body>
</html>
